name: Vela V6 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Runner diagnostics
        run: |
          echo "=== runner ==="
          uname -a
          echo "=== bash ==="
          bash --version | head -1
          echo "=== pwd ==="
          pwd
          ls -la
          echo "=== env ==="
          env | grep -i 'github\|runner' | head -20

      - uses: actions/checkout@v4

      - name: Post-checkout diagnostics
        run: |
          echo "=== git ==="
          git --version
          git log -1 --oneline
          echo "=== repo layout ==="
          ls -la
          ls scripts/tests/ || echo "(no tests dir)"
          ls scripts/hooks/ || echo "(no hooks dir)"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node diagnostics
        run: |
          node --version
          which node

      - name: Configure git (tests that create commits need an identity)
        run: |
          git config --global user.email "ci@vela-skill.local"
          git config --global user.name "Vela CI"
          git config --global commit.gpgsign false

      - name: Syntax check (install.js + hooks)
        run: |
          node --check scripts/install.js
          node --check scripts/cli/vela-engine.js
          node --check scripts/cli/vela-analyze.js
          for hook in scripts/hooks/*.js; do
            echo "checking $hook"
            node --check "$hook"
          done

      - name: V6 purity (V4.1 residue detector)
        run: bash scripts/tests/test-v6-purity.sh

      - name: Gate Keeper (VK-01~08)
        run: bash scripts/tests/test-gate-keeper.sh

      - name: Gate VK-07 (PM speed-read)
        run: bash scripts/tests/test-gate-vk07.sh

      - name: Chain operators (VK-08)
        run: bash scripts/tests/test-chain-operators.sh

      - name: Fail-closed hook behavior
        run: bash scripts/tests/test-fail-closed.sh

      - name: S03 relaxation (VG-13 + cost + stop)
        run: bash scripts/tests/test-s03-relaxation.sh

      - name: Review Gate (vela-review-gate.js — V2-4)
        run: bash scripts/tests/test-review-gate.sh

      - name: Engine record (circuit breaker + auto + revisions)
        run: bash scripts/tests/test-engine-record.sh

      - name: Sprint manager
        run: bash scripts/tests/test-sprint-manager.sh

      - name: Auto mode
        run: bash scripts/tests/test-auto-mode.sh

      - name: Change surface (reference integrity)
        run: bash scripts/tests/test-change-surface.sh

      # Known-flaky: 2 of 10 cases fail on main (worktree collision + non-vela listing).
      # Tracked separately. Allowed to fail so it doesn't block unrelated PRs.
      - name: Worktree manager (known-flaky, non-blocking)
        continue-on-error: true
        run: bash scripts/tests/test-worktree-manager.sh
