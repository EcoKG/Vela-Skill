name: Vela v8.0 Plugin Tests

on:
  push:
    branches: [main]
  pull_request:
    # Trigger on PRs targeting main OR any claude/** branch.
    # Stacking PRs (PR-onto-PR) need the second form — without it the
    # CI only runs when a PR is rebased onto main, which defeats the
    # whole point of review-before-merge for stacked changes.
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable extra diagnostics'
        required: false
        default: 'false'

# Cancel in-progress runs on the same branch when a new commit lands.
# Prevents piling up 3+ parallel runs when someone force-pushes or rebases,
# and makes sure the PR comment we sticky-update reflects the latest commit.
concurrency:
  group: vela-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only the permissions we actually use — sticky PR comments need
    # pull-requests:write, everything else is read.
    permissions:
      contents: read
      pull-requests: write

    # Job-level env: make every child shell inherit `commit.gpgsign=false`
    # so any transitive `git commit` calls in tests or fixtures don't try
    # to hit a signing hook that doesn't exist on the runner.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: commit.gpgsign
      GIT_CONFIG_VALUE_0: 'false'

    steps:
      # ───────────────────────────────────────────────────────────
      # 0. Diagnostics (fail-open — always run, cheap)
      # ───────────────────────────────────────────────────────────
      - name: Runner diagnostics
        id: s_runner
        continue-on-error: true
        run: |
          set +e
          echo "::group::runner"
          uname -a
          echo "::endgroup::"
          echo "::group::bash"
          bash --version | head -1
          echo "::endgroup::"
          echo "::group::tools"
          node --version 2>&1 || echo "(node not yet installed)"
          git --version
          jq --version 2>&1 | head -1 || echo "(jq not yet installed)"
          shellcheck --version 2>&1 | head -2 || echo "(no shellcheck yet)"
          echo "::endgroup::"

      - name: Checkout
        id: s_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        id: s_node_setup
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install shellcheck + ripgrep + jq
        id: s_sc_install
        continue-on-error: true
        run: |
          # ripgrep is required by test-change-surface.sh (reference
          # integrity scan). jq validates plugin manifests. Pre-installed
          # on most ubuntu-latest images but guard for images without them.
          if ! command -v shellcheck >/dev/null \
             || ! command -v rg >/dev/null \
             || ! command -v jq >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck ripgrep jq
          fi
          shellcheck --version | head -2
          rg --version | head -1
          jq --version | head -1

      - name: Configure git identity
        id: s_gitconfig
        continue-on-error: true
        run: |
          git config --global user.email "ci@vela-skill.local"
          git config --global user.name "Vela CI"
          git config --global commit.gpgsign false

      # ───────────────────────────────────────────────────────────
      # 1. Static checks (syntax + lint + plugin manifest validity)
      # ───────────────────────────────────────────────────────────
      - name: Syntax check — Node.js files
        id: s_syntax
        continue-on-error: true
        run: |
          set -e
          # v8.0: install.js removed. Core + commands + hooks + shared +
          # cache + cli all need syntax verification.
          node --check scripts/cli/vela-engine.js
          node --check scripts/cli/vela-friction.js
          node --check scripts/cli/vela-cost.js
          node --check scripts/cli/vela-report.js
          node --check scripts/cli/vela-nightly.js
          for dir in scripts/hooks scripts/shared scripts/cache scripts/core scripts/commands; do
            for f in "$dir"/*.js; do
              [ -f "$f" ] || continue
              echo "  checking $f"
              node --check "$f"
            done
          done

      - name: Plugin manifest validity
        id: s_plugin
        continue-on-error: true
        run: |
          set -e
          # v8.0 plugin layout — these files define the plugin entry points.
          # Malformed JSON here would make the plugin fail to load entirely.
          jq . .claude-plugin/plugin.json >/dev/null
          echo "✅ .claude-plugin/plugin.json valid JSON"
          jq . hooks/hooks.json >/dev/null
          echo "✅ hooks/hooks.json valid JSON"
          jq . package.json >/dev/null
          echo "✅ package.json valid JSON"

          # Required manifest fields
          NAME=$(jq -r .name .claude-plugin/plugin.json)
          VERSION=$(jq -r .version .claude-plugin/plugin.json)
          [ "$NAME" = "vela" ] || { echo "❌ plugin.json name must be 'vela' (got $NAME)"; exit 1; }
          [ -n "$VERSION" ] && [ "$VERSION" != "null" ] \
            || { echo "❌ plugin.json version is empty"; exit 1; }
          echo "✅ plugin name=$NAME version=$VERSION"

          # bin wrapper must be executable
          [ -x bin/vela-engine ] \
            || { echo "❌ bin/vela-engine not executable"; exit 1; }
          echo "✅ bin/vela-engine +x"

          # Every hook listed in hooks.json must point at an existing file.
          # Use `while read` not `for in $(...)` because commands contain
          # spaces (`node "path"`) and would word-split mid-command.
          # ${CLAUDE_PLUGIN_ROOT} is substituted with $PWD for this check
          # since that is where the plugin lives in the CI checkout.
          jq -r '.hooks | to_entries[] | .value[] | .hooks[] | .command' hooks/hooks.json \
          | while IFS= read -r cmd; do
              path=$(echo "$cmd" | sed 's|\${CLAUDE_PLUGIN_ROOT}|.|g; s|"||g' | awk '{print $2}')
              if [ ! -f "$path" ]; then
                echo "❌ hook references missing file: $path"
                exit 1
              fi
              echo "  ✅ hook target exists: $path"
            done

      - name: Shellcheck — test scripts + shims
        id: s_sc
        continue-on-error: true
        run: |
          set -e
          # Exclusions:
          #   SC2086  — intentional word splitting in test fixtures
          #   SC2016  — single quotes for node -e heredocs
          #   SC1091  — not following sourced files (helpers/setup-plugin-env.sh)
          #   SC2155  — declare+assign on same line is readable for short locals
          #   SC2164  — `cd "$x"` without `|| exit` — already inside subshells
          #             or test sandboxes where a missing path is a visible
          #             test failure, not silent fallback to cwd.
          #
          # v8.0: deploy-common.sh removed. install.sh/update.sh are
          # deprecation shims (still checked).
          shellcheck \
            --severity=warning \
            --exclude=SC2086,SC2016,SC1091,SC2155,SC2164 \
            scripts/tests/*.sh \
            scripts/tests/helpers/*.sh \
            bin/vela-engine \
            install.sh \
            update.sh

      - name: Meta — every test-*.sh must be wired into this workflow
        id: s_meta
        continue-on-error: true
        run: |
          set -e
          MISSING=0
          for f in scripts/tests/test-*.sh; do
            name=$(basename "$f")
            if ! grep -q "$name" .github/workflows/test.yml; then
              echo "::error file=.github/workflows/test.yml::test script $name exists but is not referenced in the workflow"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "✅ all $(ls scripts/tests/test-*.sh | wc -l) test files are wired in"
          fi
          exit $MISSING

      - name: No stale legacy references in docs or commands
        id: s_stale
        continue-on-error: true
        run: |
          set -e
          # M2 migrated `node .vela/cli/vela-engine.js` → `vela-engine` wrapper
          # across all user-facing doc and agent surfaces. Guard against
          # regressions by failing CI if the old pattern sneaks back into
          # commands/, agents/, references/, or the engine-internal
          # nextAction hints (scripts/commands/state-machine.js).
          if grep -rn 'node \.vela/cli/vela-engine' \
              commands/ agents/ references/ \
              scripts/commands/state-machine.js 2>/dev/null; then
            echo "::error::Found legacy 'node .vela/cli/vela-engine.js' reference — use 'vela-engine' (bin wrapper) instead"
            exit 1
          fi
          echo "✅ no legacy engine-path references in commands/agents/references/state-machine"

      # ───────────────────────────────────────────────────────────
      # 2. Unit / integration test suites (each with id + log file)
      # ───────────────────────────────────────────────────────────
      - name: V6 purity (V4.1 residue detector)
        id: s_purity
        continue-on-error: true
        run: |
          bash scripts/tests/test-v6-purity.sh 2>&1 | tee /tmp/v6-purity.log
          exit ${PIPESTATUS[0]}

      - name: Gate Keeper (VK-01~08)
        id: s_gk
        continue-on-error: true
        run: |
          bash scripts/tests/test-gate-keeper.sh 2>&1 | tee /tmp/gate-keeper.log
          exit ${PIPESTATUS[0]}

      - name: Gate VK-07 (PM speed-read)
        id: s_vk07
        continue-on-error: true
        run: |
          bash scripts/tests/test-gate-vk07.sh 2>&1 | tee /tmp/gate-vk07.log
          exit ${PIPESTATUS[0]}

      - name: Chain operators (VK-08)
        id: s_chain
        continue-on-error: true
        run: |
          bash scripts/tests/test-chain-operators.sh 2>&1 | tee /tmp/chain-operators.log
          exit ${PIPESTATUS[0]}

      - name: Fail-closed hook behavior
        id: s_fc
        continue-on-error: true
        run: |
          bash scripts/tests/test-fail-closed.sh 2>&1 | tee /tmp/fail-closed.log
          exit ${PIPESTATUS[0]}

      - name: S03 relaxation (VG-13 + cost + stop)
        id: s_s03
        continue-on-error: true
        run: |
          bash scripts/tests/test-s03-relaxation.sh 2>&1 | tee /tmp/s03-relaxation.log
          exit ${PIPESTATUS[0]}

      - name: Review Gate (stop-hook review-gate path)
        id: s_rg
        continue-on-error: true
        run: |
          bash scripts/tests/test-review-gate.sh 2>&1 | tee /tmp/review-gate.log
          exit ${PIPESTATUS[0]}

      - name: Engine record (circuit breaker + auto + revisions)
        id: s_er
        continue-on-error: true
        run: |
          bash scripts/tests/test-engine-record.sh 2>&1 | tee /tmp/engine-record.log
          exit ${PIPESTATUS[0]}

      - name: Auto mode
        id: s_am
        continue-on-error: true
        run: |
          bash scripts/tests/test-auto-mode.sh 2>&1 | tee /tmp/auto-mode.log
          exit ${PIPESTATUS[0]}

      - name: Change surface (reference integrity)
        id: s_cs
        continue-on-error: true
        run: |
          echo "::group::tool versions"
          rg --version 2>&1 || echo "(rg not found)"
          git --version
          echo "::endgroup::"
          bash scripts/tests/test-change-surface.sh 2>&1 | tee /tmp/change-surface.log
          exit ${PIPESTATUS[0]}

      - name: Worktree manager
        id: s_wm
        continue-on-error: true
        run: |
          bash scripts/tests/test-worktree-manager.sh 2>&1 | tee /tmp/worktree-manager.log
          exit ${PIPESTATUS[0]}

      - name: Mechanical locate (v6.1)
        id: s_loc
        continue-on-error: true
        run: |
          bash scripts/tests/test-locate.sh 2>&1 | tee /tmp/locate.log
          exit ${PIPESTATUS[0]}

      - name: Locate accuracy benchmark (v6.1 — non-blocking)
        id: s_locb
        continue-on-error: true
        run: |
          bash scripts/tests/test-locate-bench.sh 2>&1 | tee /tmp/locate-bench.log
          # always exit 0 — this is a measurement, not a gate
          exit 0

      - name: Engine walk-up project root (v7.0.6)
        id: s_ewu
        continue-on-error: true
        run: |
          bash scripts/tests/test-engine-walk-up.sh 2>&1 | tee /tmp/engine-walk-up.log
          exit ${PIPESTATUS[0]}

      - name: Commit/branch non-git guard (v7.1 M1)
        id: s_cng
        continue-on-error: true
        run: |
          bash scripts/tests/test-commit-not-a-repo.sh 2>&1 | tee /tmp/commit-not-a-repo.log
          exit ${PIPESTATUS[0]}

      - name: Slug fs-safe truncation (v7.1 M5)
        id: s_slug
        continue-on-error: true
        run: |
          bash scripts/tests/test-slug-truncate.sh 2>&1 | tee /tmp/slug-truncate.log
          exit ${PIPESTATUS[0]}

      - name: Engine advance command (v7.1 M8)
        id: s_adv
        continue-on-error: true
        run: |
          bash scripts/tests/test-engine-advance.sh 2>&1 | tee /tmp/engine-advance.log
          exit ${PIPESTATUS[0]}

      - name: Gate Keeper verify bash safelist (v7.1 M2)
        id: s_vba
        continue-on-error: true
        run: |
          bash scripts/tests/test-verify-bash-allowed.sh 2>&1 | tee /tmp/verify-bash-allowed.log
          exit ${PIPESTATUS[0]}

      - name: Researcher targeted scope enforcement (v7.1 M11)
        id: s_rts
        continue-on-error: true
        run: |
          bash scripts/tests/test-researcher-targeted-scope.sh 2>&1 | tee /tmp/researcher-targeted-scope.log
          exit ${PIPESTATUS[0]}

      - name: Engine doctor health check (v8.0 plugin-aware)
        id: s_doc
        continue-on-error: true
        run: |
          bash scripts/tests/test-engine-doctor.sh 2>&1 | tee /tmp/engine-doctor.log
          exit ${PIPESTATUS[0]}

      # ───────────────────────────────────────────────────────────
      # v7.2 Harness engineering — structured stderr + telemetry
      # + policy gate. These tests verify the "block → steer" shift:
      # hooks still exit 2 but now emit VK/VG codes to stderr, log
      # every block to gate-events.jsonl, and respect the new
      # .vela/config.json#gate_policy (ask/allow opt-in).
      # ───────────────────────────────────────────────────────────
      - name: Gate structured stderr (v7.2)
        id: s_gse
        continue-on-error: true
        run: |
          bash scripts/tests/test-gate-stderr.sh 2>&1 | tee /tmp/gate-stderr.log
          exit ${PIPESTATUS[0]}

      - name: Gate telemetry jsonl (v7.2)
        id: s_gtl
        continue-on-error: true
        run: |
          bash scripts/tests/test-gate-telemetry.sh 2>&1 | tee /tmp/gate-telemetry.log
          exit ${PIPESTATUS[0]}

      - name: Gate policy (ask/allow — v7.2)
        id: s_gpo
        continue-on-error: true
        run: |
          bash scripts/tests/test-gate-policy.sh 2>&1 | tee /tmp/gate-policy.log
          exit ${PIPESTATUS[0]}

      - name: Engine state v7.2 fields (M1/M2/M13)
        id: s_v72ef
        continue-on-error: true
        run: |
          bash scripts/tests/test-v72-engine-fields.sh 2>&1 | tee /tmp/v72-engine-fields.log
          exit ${PIPESTATUS[0]}

      - name: v7.2 observational hooks (M8)
        id: s_v72hk
        continue-on-error: true
        run: |
          bash scripts/tests/test-v72-hooks.sh 2>&1 | tee /tmp/v72-hooks.log
          exit ${PIPESTATUS[0]}

      - name: v7.2 nightly + managed entry (M14/M15)
        id: s_v72nm
        continue-on-error: true
        run: |
          bash scripts/tests/test-v72-nightly-managed.sh 2>&1 | tee /tmp/v72-nightly-managed.log
          exit ${PIPESTATUS[0]}

      # ───────────────────────────────────────────────────────────
      # v8.0 plugin smoke — end-to-end /vela:install flow
      # ───────────────────────────────────────────────────────────
      - name: Plugin bootstrap smoke (init-project in fresh repo)
        id: s_boot
        continue-on-error: true
        run: |
          set -e
          FIXTURE=$(mktemp -d)
          ( cd "$FIXTURE" \
            && git init -q \
            && git -c commit.gpgsign=false commit --allow-empty -q -m init )
          INIT_CWD="$FIXTURE" CLAUDE_PLUGIN_ROOT="$PWD" \
            node scripts/cli/vela-engine.js init-project \
            > /tmp/plugin-bootstrap.log 2>&1

          # Validate the fixture got the expected structure.
          set +e
          FAIL=0
          for expected in \
              "$FIXTURE/.vela/config.json" \
              "$FIXTURE/.vela/templates/pipeline.json" \
              "$FIXTURE/.vela/state/workspace.json" \
              "$FIXTURE/.vela/artifacts" \
              "$FIXTURE/.vela/learnings"; do
            if [ ! -e "$expected" ]; then
              echo "  ❌ init-project did not create: $expected" \
                | tee -a /tmp/plugin-bootstrap.log
              FAIL=$((FAIL + 1))
            else
              echo "  ✅ $expected"
            fi
          done

          # workspace.json must record both projectRoot and pluginRoot
          jq -e '.projectRoot and .pluginRoot and .version' \
            "$FIXTURE/.vela/state/workspace.json" >/dev/null \
            || { echo "  ❌ workspace.json missing required fields"; FAIL=$((FAIL + 1)); }

          rm -rf "$FIXTURE"
          [ "$FAIL" -eq 0 ]

      # ───────────────────────────────────────────────────────────
      # 3. Reporting — GITHUB_STEP_SUMMARY + sticky PR comment +
      #    artifact upload on failure
      # ───────────────────────────────────────────────────────────
      - name: Build report (outcomes + PASS/FAIL counts)
        id: s_report
        if: always()
        env:
          R_RUNNER: ${{ steps.s_runner.outcome }}
          R_CHECKOUT: ${{ steps.s_checkout.outcome }}
          R_NODE_SETUP: ${{ steps.s_node_setup.outcome }}
          R_SC_INSTALL: ${{ steps.s_sc_install.outcome }}
          R_GITCONFIG: ${{ steps.s_gitconfig.outcome }}
          R_SYNTAX: ${{ steps.s_syntax.outcome }}
          R_PLUGIN: ${{ steps.s_plugin.outcome }}
          R_SHELLCHECK: ${{ steps.s_sc.outcome }}
          R_META: ${{ steps.s_meta.outcome }}
          R_STALE: ${{ steps.s_stale.outcome }}
          R_PURITY: ${{ steps.s_purity.outcome }}
          R_GK: ${{ steps.s_gk.outcome }}
          R_VK07: ${{ steps.s_vk07.outcome }}
          R_CHAIN: ${{ steps.s_chain.outcome }}
          R_FC: ${{ steps.s_fc.outcome }}
          R_S03: ${{ steps.s_s03.outcome }}
          R_RG: ${{ steps.s_rg.outcome }}
          R_ER: ${{ steps.s_er.outcome }}
          R_AM: ${{ steps.s_am.outcome }}
          R_CS: ${{ steps.s_cs.outcome }}
          R_WM: ${{ steps.s_wm.outcome }}
          R_LOC: ${{ steps.s_loc.outcome }}
          R_LOCB: ${{ steps.s_locb.outcome }}
          R_EWU: ${{ steps.s_ewu.outcome }}
          R_CNG: ${{ steps.s_cng.outcome }}
          R_SLUG: ${{ steps.s_slug.outcome }}
          R_ADV: ${{ steps.s_adv.outcome }}
          R_VBA: ${{ steps.s_vba.outcome }}
          R_RTS: ${{ steps.s_rts.outcome }}
          R_DOC: ${{ steps.s_doc.outcome }}
          R_GSE: ${{ steps.s_gse.outcome }}
          R_GTL: ${{ steps.s_gtl.outcome }}
          R_GPO: ${{ steps.s_gpo.outcome }}
          R_V72EF: ${{ steps.s_v72ef.outcome }}
          R_V72HK: ${{ steps.s_v72hk.outcome }}
          R_V72NM: ${{ steps.s_v72nm.outcome }}
          R_BOOT: ${{ steps.s_boot.outcome }}
        run: |
          set -e
          # Build an ordered list: label | outcome | log_file
          # The log_file is blank for steps without an associated log.
          cat > /tmp/report-rows.tsv <<EOF
          Setup: runner diagnostics	${R_RUNNER}
          Setup: checkout	${R_CHECKOUT}
          Setup: node	${R_NODE_SETUP}
          Setup: shellcheck+rg+jq install	${R_SC_INSTALL}
          Setup: git config	${R_GITCONFIG}
          Static: node syntax	${R_SYNTAX}
          Static: plugin manifest	${R_PLUGIN}
          Static: shellcheck	${R_SHELLCHECK}
          Static: meta-wiring	${R_META}
          Static: no stale engine-path refs	${R_STALE}
          Unit: v6-purity	${R_PURITY}	/tmp/v6-purity.log
          Unit: gate-keeper	${R_GK}	/tmp/gate-keeper.log
          Unit: gate-vk07	${R_VK07}	/tmp/gate-vk07.log
          Unit: chain-operators	${R_CHAIN}	/tmp/chain-operators.log
          Unit: fail-closed	${R_FC}	/tmp/fail-closed.log
          Unit: s03-relaxation	${R_S03}	/tmp/s03-relaxation.log
          Unit: review-gate	${R_RG}	/tmp/review-gate.log
          Unit: engine-record	${R_ER}	/tmp/engine-record.log
          E2E: auto-mode	${R_AM}	/tmp/auto-mode.log
          E2E: change-surface	${R_CS}	/tmp/change-surface.log
          E2E: worktree-manager	${R_WM}	/tmp/worktree-manager.log
          Unit: locate (v6.1)	${R_LOC}	/tmp/locate.log
          Bench: locate accuracy (v6.1, non-blocking)	${R_LOCB}	/tmp/locate-bench.log
          Unit: engine walk-up project root (v7.0.6)	${R_EWU}	/tmp/engine-walk-up.log
          Unit: commit/branch non-git guard (v7.1 M1)	${R_CNG}	/tmp/commit-not-a-repo.log
          Unit: slug fs-safe truncation (v7.1 M5)	${R_SLUG}	/tmp/slug-truncate.log
          Unit: engine advance command (v7.1 M8)	${R_ADV}	/tmp/engine-advance.log
          Unit: verify bash safelist (v7.1 M2)	${R_VBA}	/tmp/verify-bash-allowed.log
          Unit: researcher targeted scope (v7.1 M11)	${R_RTS}	/tmp/researcher-targeted-scope.log
          Unit: engine doctor (v8.0 plugin-aware)	${R_DOC}	/tmp/engine-doctor.log
          Unit: gate structured stderr (v7.2)	${R_GSE}	/tmp/gate-stderr.log
          Unit: gate telemetry jsonl (v7.2)	${R_GTL}	/tmp/gate-telemetry.log
          Unit: gate policy ask/allow (v7.2)	${R_GPO}	/tmp/gate-policy.log
          Unit: engine state v7.2 fields (M1/M2/M13)	${R_V72EF}	/tmp/v72-engine-fields.log
          Unit: v7.2 observational hooks (M8)	${R_V72HK}	/tmp/v72-hooks.log
          Unit: v7.2 nightly + managed entry (M14/M15)	${R_V72NM}	/tmp/v72-nightly-managed.log
          E2E: plugin bootstrap (v8.0 init-project)	${R_BOOT}	/tmp/plugin-bootstrap.log
          EOF

          PASS=0
          FAIL=0
          TOTAL=0
          while IFS=$'\t' read -r label outcome logfile; do
            [ -z "$label" ] && continue
            TOTAL=$((TOTAL + 1))
            case "$outcome" in
              success)  PASS=$((PASS + 1)) ;;
              failure)  FAIL=$((FAIL + 1)) ;;
              skipped)  ;;
              *)        ;;
            esac
          done < /tmp/report-rows.tsv

          echo "PASS=$PASS"   >> "$GITHUB_OUTPUT"
          echo "FAIL=$FAIL"   >> "$GITHUB_OUTPUT"
          echo "TOTAL=$TOTAL" >> "$GITHUB_OUTPUT"

          # ── GITHUB_STEP_SUMMARY (visible in Actions run UI) ──
          {
            echo "# ⛵ Vela v8.0 Plugin Test Report"
            echo ""
            if [ "$FAIL" -eq 0 ]; then
              echo "**✅ $PASS / $TOTAL steps passed**"
            else
              echo "**❌ $PASS / $TOTAL passed, $FAIL failed**"
            fi
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            while IFS=$'\t' read -r label outcome logfile; do
              [ -z "$label" ] && continue
              case "$outcome" in
                success)  emoji="✅" ;;
                failure)  emoji="❌" ;;
                skipped)  emoji="⏭️" ;;
                *)        emoji="❓" ;;
              esac
              echo "| ${label} | ${emoji} ${outcome} |"
            done < /tmp/report-rows.tsv
            echo ""
            echo "Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # ── PR comment body (written to /tmp/pr-body.md) ──
          {
            echo "<!-- vela-ci-report -->"
            echo "## ⛵ Vela v8.0 Plugin Test Report"
            echo ""
            if [ "$FAIL" -eq 0 ]; then
              echo "**✅ $PASS / $TOTAL steps passed** — run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on \`${{ github.sha }}\`"
            else
              echo "**❌ $PASS / $TOTAL passed, $FAIL failed** — run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on \`${{ github.sha }}\`"
            fi
            echo ""
            echo "<details><summary>Per-step outcomes</summary>"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            while IFS=$'\t' read -r label outcome logfile; do
              [ -z "$label" ] && continue
              case "$outcome" in
                success)  emoji="✅" ;;
                failure)  emoji="❌" ;;
                skipped)  emoji="⏭️" ;;
                *)        emoji="❓" ;;
              esac
              echo "| ${label} | ${emoji} ${outcome} |"
            done < /tmp/report-rows.tsv
            echo ""
            echo "</details>"
            echo ""
            # Include tails of failing logs
            if [ "$FAIL" -gt 0 ]; then
              echo "### Failing step logs"
              echo ""
              while IFS=$'\t' read -r label outcome logfile; do
                [ -z "$label" ] && continue
                [ "$outcome" != "failure" ] && continue
                [ -z "$logfile" ] && continue
                [ ! -f "$logfile" ] && continue
                echo "<details><summary>${label} — last 120 lines</summary>"
                echo ""
                echo '```'
                tail -120 "$logfile"
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              done < /tmp/report-rows.tsv
            fi
          } > /tmp/pr-body.md

      - name: Post or update sticky PR comment
        id: s_sticky
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Sticky comment: look for an existing bot comment that contains
          # our marker "<!-- vela-ci-report -->" and update it; otherwise
          # create a new one. This keeps the PR history clean — one CI
          # comment per PR, always reflecting the most recent run.
          MARKER="<!-- vela-ci-report -->"
          EXISTING_ID=$(gh api \
            "repos/$REPO/issues/$PR/comments" \
            --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" \
            | head -n 1)

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing sticky comment $EXISTING_ID"
            gh api \
              --method PATCH \
              "repos/$REPO/issues/comments/$EXISTING_ID" \
              -F body=@/tmp/pr-body.md >/dev/null
          else
            echo "Creating new sticky comment"
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/pr-body.md
          fi

      - name: Upload test logs as artifact
        id: s_artifact
        if: always() && (steps.s_report.outputs.FAIL != '0')
        uses: actions/upload-artifact@v4
        with:
          name: vela-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/*.log
            /tmp/report-rows.tsv
            /tmp/pr-body.md
          retention-days: 14
          if-no-files-found: warn

      # ───────────────────────────────────────────────────────────
      # 4. Final gate — fail the job if any required step failed.
      #    Every previous step has continue-on-error: true for
      #    diagnostic visibility; this step re-enforces the real
      #    pass/fail policy.
      # ───────────────────────────────────────────────────────────
      - name: Fail job if any required step failed
        if: always()
        env:
          FAIL_COUNT: ${{ steps.s_report.outputs.FAIL }}
          PASS_COUNT: ${{ steps.s_report.outputs.PASS }}
          TOTAL_COUNT: ${{ steps.s_report.outputs.TOTAL }}
        run: |
          if [ "$FAIL_COUNT" = "0" ] && [ -n "$FAIL_COUNT" ]; then
            echo "✅ all $PASS_COUNT/$TOTAL_COUNT required steps passed"
            exit 0
          fi
          echo "❌ $FAIL_COUNT step(s) failed, $PASS_COUNT/$TOTAL_COUNT passed"
          exit 1
